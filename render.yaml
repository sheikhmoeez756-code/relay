# Render Blueprint: free web service built from the Dockerfile.
# The database is external (Neon free tier): paste its connection string as DATABASE_URL.
services:
  - type: web
    name: relay
    runtime: docker
    plan: free
    region: ohio # same AWS region as the Neon database (us-east-2)
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: 'true'
